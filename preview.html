<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Todo Preview</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; }
  ul { list-style: none; padding: 0; }
  li { padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; }
  .empty, .error { color: #888; }
  .error { color: #c00; }
  .field { display: flex; gap: 6px; padding: 2px 0; }
  .field-key { color: #888; min-width: 90px; }
  .field-value { word-break: break-all; }
</style>
</head>
<body>
  <h1>Test Todos</h1>
  <ul id="todo-list"><li class="empty">불러오는 중...</li></ul>

  <script>
    const SUPABASE_URL = "https://fcyjfjiepdrcbnqitpga.supabase.co/rest/v1/test_todos?select=*";
    const SUPABASE_KEY = "sb_publishable_4JnFgRJvaj07ksKQP6G1Hw_xkS6eHR";

    async function loadTodos() {
      const listEl = document.getElementById("todo-list");
      try {
        const res = await fetch(SUPABASE_URL, {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        });
        if (!res.ok) throw new Error(`요청 실패: ${res.status}`);
        const todos = await res.json();

        if (!todos.length) {
          listEl.innerHTML = '<li class="empty">등록된 항목이 없습니다.</li>';
          return;
        }

        listEl.innerHTML = todos
          .map(todo => {
            const fields = Object.entries(todo)
              .map(([key, value]) => `
                <div class="field">
                  <span class="field-key">${key}</span>
                  <span class="field-value">${value === null ? "-" : String(value)}</span>
                </div>
              `)
              .join("");
            return `<li>${fields}</li>`;
          })
          .join("");
      } catch (err) {
        listEl.innerHTML = `<li class="error">오류: ${err.message}</li>`;
      }
    }

    loadTodos();
  </script>
</body>
</html>
